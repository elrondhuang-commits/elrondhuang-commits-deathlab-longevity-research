name: A2 identity linkage augment v0.3
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  augment:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify V0.3 linkage logic
        run: |
          python -m pip install pytest==8.4.1
          pytest -q unblind/test_v0_3_logic.py
      - name: Download frozen V0.2 linkage artifact
        run: python unblind/download_latest_artifact.py deathlab-a2-identity-linkage-freeze-v0-2 artifacts/base
      - name: Materialize exact A2 birth corpus
        run: python scripts/materialize_a2.py artifacts/A2.frozen.csv
      - name: Verify V0.2 commitment
        run: |
          python - <<'PY'
          import hashlib,json,pathlib
          P=pathlib.Path; expected="a3080e44b50382665d063dc2d7249f764a0d77efc368535e2581b0d2a50c7982"
          links=P("artifacts/base/A2_identity_links_v0_2.csv")
          side=P("artifacts/base/A2_identity_links_v0_2.sha256").read_text().split()[0]
          s=json.load(open("artifacts/base/A2_identity_links_v0_2.summary.json"))
          assert hashlib.sha256(links.read_bytes()).hexdigest()==expected==side==s["linkage_sha256"]
          assert s["death_truth_accessed"] is False and s["prediction_used_for_linkage"] is False
          assert s["forbidden_properties_queried"]==[]
          PY
      - name: Freeze V0.3 code and protocol
        run: |
          mkdir -p artifacts
          sha256sum unblind/augment_v0_3_fuzzy.py > artifacts/V0_3_CODE.sha256
          sha256sum unblind/A2_IDENTITY_LINKAGE_AUGMENT_V0_3_PROTOCOL.json > artifacts/V0_3_PROTOCOL.sha256
      - name: Run outcome-blind V0.3 augmentation
        run: |
          python unblind/augment_v0_3_fuzzy.py \
            --a2 artifacts/A2.frozen.csv \
            --base-links artifacts/base/A2_identity_links_v0_2.csv \
            --base-links-sha artifacts/base/A2_identity_links_v0_2.sha256 \
            --base-summary artifacts/base/A2_identity_links_v0_2.summary.json \
            --out artifacts/A2_identity_links_v0_3.csv
      - name: Verify V0.3 freeze
        run: |
          python - <<'PY'
          import csv,json
          rows=list(csv.DictReader(open("artifacts/A2_identity_links_v0_3.csv",encoding="utf-8",newline="")))
          assert len(rows)==3643 and len({r["NUM"] for r in rows})==3643
          s=json.load(open("artifacts/A2_identity_links_v0_3.summary.json"))
          assert s["death_truth_accessed"] is False
          assert s["prediction_used_for_linkage"] is False
          assert s["forbidden_properties_queried"]==[]
          print(json.dumps(s,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: deathlab-a2-identity-linkage-freeze-v0-3
          path: |
            artifacts/A2_identity_links_v0_3.csv
            artifacts/A2_identity_links_v0_3.sha256
            artifacts/A2_identity_links_v0_3.summary.json
            artifacts/V0_3_CODE.sha256
            artifacts/V0_3_PROTOCOL.sha256
          if-no-files-found: error
          retention-days: 90
