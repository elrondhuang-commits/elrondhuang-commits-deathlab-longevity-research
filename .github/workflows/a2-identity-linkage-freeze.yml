name: A2 identity linkage freeze

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "unblind/link_wikidata.py"
      - "unblind/A2_IDENTITY_LINKAGE_PROTOCOL_V0_1.json"
      - "unblind/PREUNBLIND_AUDIT_V0_1.md"
      - ".github/workflows/a2-identity-linkage-freeze.yml"

permissions:
  contents: read

jobs:
  link:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify frozen linkage logic
        run: |
          python -m pip install --upgrade pip
          pip install pytest==8.4.1
          pytest -q unblind/test_linkage_logic.py

      - name: Materialize exact A2 birth corpus
        run: python scripts/materialize_a2.py artifacts/A2.frozen.csv

      - name: Freeze linkage code and protocol hashes before network linkage
        run: |
          mkdir -p artifacts
          sha256sum unblind/link_wikidata.py > artifacts/LINKAGE_CODE.sha256
          sha256sum unblind/A2_IDENTITY_LINKAGE_PROTOCOL_V0_1.json > artifacts/LINKAGE_PROTOCOL.sha256
          cat artifacts/LINKAGE_CODE.sha256
          cat artifacts/LINKAGE_PROTOCOL.sha256

      - name: Run outcome-blind Wikidata identity linkage
        run: |
          python unblind/link_wikidata.py             artifacts/A2.frozen.csv             artifacts/A2_identity_links.csv             --workers 4

      - name: Verify linkage freeze
        run: |
          wc -l artifacts/A2_identity_links.csv
          cat artifacts/A2_identity_links.sha256
          cat artifacts/A2_identity_links.summary.json
          python - <<'PY'
          import csv, json
          with open("artifacts/A2_identity_links.csv", encoding="utf-8", newline="") as f:
              rows = list(csv.DictReader(f))
          assert len(rows) == 3643
          assert len({r["NUM"] for r in rows}) == 3643
          s = json.load(open("artifacts/A2_identity_links.summary.json", encoding="utf-8"))
          assert s["death_truth_accessed"] is False
          assert s["forbidden_properties_queried"] == []
          print("PASS pre-P570 linkage freeze")
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: deathlab-a2-identity-linkage-freeze
          path: |
            artifacts/A2_identity_links.csv
            artifacts/A2_identity_links.sha256
            artifacts/A2_identity_links.summary.json
            artifacts/LINKAGE_CODE.sha256
            artifacts/LINKAGE_PROTOCOL.sha256
          if-no-files-found: error
          retention-days: 90
