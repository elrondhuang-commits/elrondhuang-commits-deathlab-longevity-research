name: A1 second-cohort birth-only prediction freeze

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  freeze:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install exact predictor environment
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .
          pip install pytest==8.4.1

      - name: Verify existing frozen Challenger and wrapper
        run: |
          test "$(sha256sum src/deathlab_longevity/challenger.py | awk '{print $1}')" = "db33e2a42cba698b15a6ab14844ef306b777d4986baf0ed8107581aa70c1aa8e"
          test "$(sha256sum protocol/CHALLENGER_SPEC_LOCK.json | awk '{print $1}')" = "ea773ac338dde73084666edb63988bd6716a2efe7493c599ea14e9fd7f091a4c"
          pytest -q tests/test_challenger.py
          pytest -q tests/test_a1_wrapper.py

      - name: Materialize commit-pinned A1 birth corpus
        run: |
          mkdir -p artifacts
          python scripts/materialize_a1.py \
            artifacts/A1.frozen.csv \
            artifacts/A1_SOURCE_LOCK.json

      - name: Freeze source and wrapper hashes before prediction
        run: |
          sha256sum artifacts/A1.frozen.csv > artifacts/A1_SOURCE_BYTES.sha256
          sha256sum artifacts/A1_SOURCE_LOCK.json > artifacts/A1_SOURCE_LOCK.sha256
          sha256sum scripts/predict_frozen_cohort.py > artifacts/A1_WRAPPER_CODE.sha256
          sha256sum src/deathlab_longevity/challenger.py > artifacts/CHALLENGER_CODE.sha256
          sha256sum protocol/CHALLENGER_SPEC_LOCK.json > artifacts/CHALLENGER_SPEC.sha256
          cat artifacts/A1_SOURCE_LOCK.json
          cat artifacts/*.sha256

      - name: Generate A1 frozen predictions
        run: |
          python scripts/predict_frozen_cohort.py \
            artifacts/A1.frozen.csv \
            artifacts/CHALLENGER_A1_predictions.csv \
            2087

      - name: Verify prediction commitment
        run: |
          python - <<'PY'
          import csv, json, hashlib
          p="artifacts/CHALLENGER_A1_predictions.csv"
          rows=list(csv.DictReader(open(p,encoding="utf-8",newline="")))
          assert len(rows)==2087
          assert len({r["NUM"] for r in rows})==2087
          s=json.load(open("artifacts/CHALLENGER_A1_predictions.summary.json",encoding="utf-8"))
          assert s["source_rows"]==2087
          assert s["outcome_accessed"] is False
          assert s["challenger_sha256"]=="db33e2a42cba698b15a6ab14844ef306b777d4986baf0ed8107581aa70c1aa8e"
          assert hashlib.sha256(open(p,"rb").read()).hexdigest()==s["predictions_sha256"]
          print(json.dumps(s,indent=2))
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: deathlab-a1-birth-only-prediction-freeze
          path: |
            artifacts/A1_SOURCE_LOCK.json
            artifacts/A1_SOURCE_BYTES.sha256
            artifacts/A1_SOURCE_LOCK.sha256
            artifacts/A1_WRAPPER_CODE.sha256
            artifacts/CHALLENGER_CODE.sha256
            artifacts/CHALLENGER_SPEC.sha256
            artifacts/CHALLENGER_A1_predictions.csv
            artifacts/CHALLENGER_A1_predictions.sha256
            artifacts/CHALLENGER_A1_predictions.summary.json
          if-no-files-found: error
          retention-days: 90
