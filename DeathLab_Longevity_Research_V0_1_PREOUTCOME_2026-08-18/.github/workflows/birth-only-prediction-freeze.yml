name: Birth-only prediction freeze

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "scripts/**"
      - "tests/**"
      - "protocol/**"
      - "requirements.txt"
      - "pyproject.toml"
      - ".github/workflows/birth-only-prediction-freeze.yml"

permissions:
  contents: read

jobs:
  freeze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .

      - name: Verify predictor
        run: pytest -q

      - name: Materialize exact A2 birth corpus
        run: python scripts/materialize_a2.py artifacts/A2.frozen.csv

      - name: Generate birth-only frozen predictions
        run: python scripts/predict_a2.py artifacts/A2.frozen.csv artifacts/CHALLENGER_A2_predictions.csv

      - name: Record code and protocol hashes
        run: |
          sha256sum src/deathlab_longevity/challenger.py > artifacts/REIMPLEMENTATION_CODE.sha256
          sha256sum protocol/CHALLENGER_SPEC_LOCK.json > artifacts/SPEC_LOCK.sha256
          sha256sum protocol/A2_SOURCE_LOCK.json > artifacts/A2_SOURCE_LOCK.sha256
          cat artifacts/*.sha256
          cat artifacts/CHALLENGER_A2_predictions.summary.json

      - uses: actions/upload-artifact@v4
        with:
          name: deathlab-a2-birth-only-prediction-freeze
          path: |
            artifacts/CHALLENGER_A2_predictions.csv
            artifacts/CHALLENGER_A2_predictions.sha256
            artifacts/CHALLENGER_A2_predictions.summary.json
            artifacts/REIMPLEMENTATION_CODE.sha256
            artifacts/SPEC_LOCK.sha256
            artifacts/A2_SOURCE_LOCK.sha256
          if-no-files-found: error
          retention-days: 90
