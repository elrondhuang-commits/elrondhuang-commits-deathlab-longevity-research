[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "deathlab-longevity-research"
version = "0.1.0"
description = "Outcome-blind DeathLab longevity research harness"
requires-python = ">=3.11"
dependencies = ["pyswisseph==2.10.3.2"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
